<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ýolýoldaş — Admin Panel Login</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root {
  --bg-main: #0B0F19;
  --panel-bg: #151D2A;
  --card-bg: #1E293B;
  --accent-green: #00E676;
  --accent-blue: #00E5FF;
  --accent-red: #FF1744;
  --text-light: #F8FAFC;
  --text-muted: #94A3B8;
  --border: #334155;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: sans-serif;
}
body {
  background-color: var(--bg-main);
  color: var(--text-light);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.login-card {
  background-color: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 30px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.login-header {
  text-align: center;
  margin-bottom: 25px;
}
.login-header h2 {
  color: var(--accent-blue);
  font-size: 22px;
  margin-bottom: 5px;
}
.login-header p {
  color: var(--text-muted);
  font-size: 13px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}
.form-group label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
}
input {
  background-color: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text-light);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus {
  border-color: var(--accent-blue);
}
.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(90deg, #00E5FF 0%, #00E676 100%);
  border: none;
  color: #000;
  font-size: 15px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  text-transform: uppercase;
  margin-top: 10px;
}
.btn-login:hover {
  opacity: 0.9;
}
.btn-back {
  display: block;
  text-align: center;
  margin-top: 15px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
}
.btn-back:hover {
  color: var(--accent-blue);
}
.error-msg {
  color: var(--accent-red);
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  display: none;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h2>🔐 ADMIN PANEL</h2>
    <p>Diňe adminler üçin giriş sahypasy</p>
  </div>

  <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
    <div class="form-group">
      <label>Admin Login (Email)</label>
      <input type="email" id="adminEmail" placeholder="200707@gmail.com" required>
    </div>

    <div class="form-group">
      <label>Parol</label>
      <input type="password" id="adminPassword" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-login">Giriş Yap</button>
    <div id="errorMsg" class="error-msg">❌ Login ýa-da parol ýalňyş!</div>
  </form>

  <a href="index.html" class="btn-back">⬅️ Baş sahypa dön</a>
</div>

<script>
const ADMIN_EMAIL = "200707@gmail.com";
const ADMIN_PASSWORD = "20+90ye12m";

function handleAdminLogin(e) {
  e.preventDefault();
  const email = document.getElementById("adminEmail").value.trim();
  const pass = document.getElementById("adminPassword").value.trim();
  const errorMsg = document.getElementById("errorMsg");

  if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
    sessionStorage.setItem("isAdminLoggedIn", "true");
    alert("✅ Admin paneline üstünlikli girildi!");
    window.location.href = "index.html?admin=true";
  } else {
    errorMsg.style.display = "block";
  }
}
</script>

</body>
</html>
