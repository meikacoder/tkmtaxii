<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ýolýoldaş — PRO Töleg Sahypasy</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg-main: #0B0F19;
  --panel-bg: #151D2A;
  --card-bg: #1E293B;
  --accent-green: #00E676;
  --accent-blue: #00E5FF;
  --accent-gold: #FFD700;
  --text-light: #F8FAFC;
  --text-muted: #94A3B8;
  --border: #334155;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: var(--bg-main); color: var(--text-light); padding: 20px; display: flex; justify-content: center; }
.pay-container { max-width: 500px; width: 100%; background: var(--panel-bg); border: 1px solid var(--accent-gold); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
h2 { color: var(--accent-gold); margin-bottom: 10px; font-size: 22px; text-align: center; }
p.subtitle { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px; }
.info-card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
.phone-number { font-size: 20px; font-weight: bold; color: var(--accent-green); margin: 8px 0; }
.form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
input, select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-light); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
input:focus, select:focus { border-color: var(--accent-blue); }
.btn-pay { width: 100%; padding: 14px; background: linear-gradient(90deg, #FFD700 0%, #FF9100 100%); border: none; color: #000; font-weight: bold; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
.btn-pay:hover { transform: scale(1.02); }
.back-link { display: block; text-align: center; margin-top: 15px; color: var(--accent-blue); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>

<div class="pay-container">
  <h2>VIP / PRO Sürüji Tölegi</h2>
  <p class="subtitle">Tölegi aşakdaky belgi goýup, haýyşy ugradyň.</p>

  <div class="info-card">
    <div>Töleg Geçirilmeli TMCELL Belgi:</div>
    <div class="phone-number">+993 64 410621</div>
    <small style="color:var(--text-muted);">TMCELL Paýagasy / Çek arkaly</small>
  </div>

  <form id="paymentForm" onsubmit="submitPayment(event)">
    <div class="form-group">
      <label>Meýilnama Saýlaň</label>
      <select id="planSelect" required>
        <option value="standard-3">Standard — 5 TMT (3 Gün)</option>
        <option value="premium-10">Premium — 10 TMT (10 Gün)</option>
        <option value="pro-30">PRO User — 20 TMT (1 Aý)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Töleg Edilen Telefon Belgiňiz</label>
      <input type="tel" id="senderPhone" placeholder="+99365XXXXXX" required>
    </div>

    <div class="form-group">
      <label>Töleg Belligi / Çek Nomeri (Meňzeş Maglumat)</label>
      <input type="text" id="transactionNote" placeholder="Meselem: Paýagasy töleg wagty 14:30" required>
    </div>

    <button type="submit" class="btn-pay" id="payBtn">✅ Tölegi Tassyklaýyş Ugrat</button>
  </form>

  <a href="index.html" class="back-link">← Esasy Sahypa Gaýtmak</a>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDYTMyZxMr_6LsF1f6kNaIVKS5ITrvcMQ4",
  authDomain: "tkmtaxi-a99f4.firebaseapp.com",
  projectId: "tkmtaxi-a99f4",
  storageBucket: "tkmtaxi-a99f4.firebasestorage.app",
  messagingSenderId: "1087594401129",
  appId: "1:1087594401129:web:7af17c0d47e91a7f6cc1f8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
auth.onAuthStateChanged(user => {
  currentUser = user;
  if (!user) {
    alert("Töleg etmek üçin ilki ulgama girmeli!");
    window.location.href = "index.html";
  }
});

async function submitPayment(e) {
  e.preventDefault();
  if (!currentUser) return;

  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  payBtn.innerText = "Ugradylýar...";

  const planVal = document.getElementById('planSelect').value;
  let days = 3;
  if (planVal === 'premium-10') days = 10;
  if (planVal === 'pro-30') days = 30;

  try {
    await db.collection("users").doc(currentUser.uid).set({
      requestedPlan: planVal,
      requestedDays: days,
      paymentStatus: "pending",
      userEmail: currentUser.email,
      userName: currentUser.displayName || 'Ulanyjy',
      senderPhone: document.getElementById('senderPhone').value,
      transactionNote: document.getElementById('transactionNote').value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    alert("📩 Töleg haýyşyňyz üstünlikli ugradyldy! Admin barlap PRO statusy aktiwleşdirer.");
    window.location.href = "index.html";
  } catch (err) {
    alert("Ýalňyşlyk döredi: " + err.message);
  } finally {
    payBtn.disabled = false;
    payBtn.innerText = "✅ Tölegi Tassyklaýyş Ugrat";
  }
}
</script>
</body>
</html>
